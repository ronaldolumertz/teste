    <script>if(localStorage.getItem('theme')==='light')document.documentElement.classList.add('light');window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();window.__pwaPrompt=e});try{var _ss=JSON.parse(sessionStorage.getItem('_sysSettings')||'{}');if(_ss.default_accent&&/^#[0-9a-fA-F]{6}$/.test(_ss.default_accent)){var _h=_ss.default_accent,_r=parseInt(_h.slice(1,3),16),_g=parseInt(_h.slice(3,5),16),_b=parseInt(_h.slice(5,7),16);var _dk=function(v){return Math.max(0,Math.min(255,Math.round(v*.84)));};var _hx=function(v){return v.toString(16).padStart(2,'0');};document.documentElement.style.setProperty('--accent',_h);document.documentElement.style.setProperty('--accent-hover','#'+_hx(_dk(_r))+_hx(_dk(_g))+_hx(_dk(_b)));document.documentElement.style.setProperty('--accent-light','rgba('+_r+','+_g+','+_b+',.15)');var _m=document.querySelector('meta[name="theme-color"]');if(!_m){_m=document.createElement('meta');_m.name='theme-color';document.head.appendChild(_m);}_m.content=_h;}}catch(e){}</script>
